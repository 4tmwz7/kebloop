name: Linux

on:
  push:
    paths:
      - 'linux/**'
      - 'Sources/Kebloop/Resources/**'
      - 'Sources/KebloopCore/Resources/**'
      - '.github/workflows/linux.yml'
  pull_request:
    paths:
      - 'linux/**'
      - 'Sources/Kebloop/Resources/**'
      - 'Sources/KebloopCore/Resources/**'
      - '.github/workflows/linux.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Arch ships GTK 4.14+, libadwaita 1.6+ and gtk4-layer-shell, which Ubuntu LTS lacks.
    container: archlinux:latest
    defaults:
      run:
        working-directory: linux
    steps:
      - name: Install system packages
        working-directory: .
        run: |
          pacman -Syu --noconfirm --needed base-devel git pkgconf rustup gtk4 libadwaita gtk4-layer-shell wayland dbus
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable

      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build release
        run: cargo build --release --locked
